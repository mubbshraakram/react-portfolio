<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mubbshra Akram | React and AI web developer</title>
    <meta
      name="description"
      content="Portfolio of Mubbshra Akram, a React developer building admin dashboards, POS systems and AI-integrated web apps."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set the theme before first paint so there is no flash.
      try {
        var saved = localStorage.getItem('theme')
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
        document.documentElement.setAttribute(
          'data-theme',
          saved || (prefersLight ? 'light' : 'dark')
        )
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
